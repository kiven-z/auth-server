server:
  port: 8080
  tomcat:
    threads:
      max: 300
      min-spare: 30
    accept-count: 200
    max-connections: 10000
  servlet:
    session:
      timeout: 40m
  reactive:
    session:
      timeout: 40m
spring:
  application:
    name: auth-gateway
  main:
    web-application-type: reactive
  config:
    import:
      - nacos:common-config.yaml?group=AUTH_COMMON
      - nacos:auth-gateway.yaml
  profiles:
    active: test
    include:
      - route

  cloud:
    nacos:
      server-addr: 192.168.3.4:8848
      discovery:
        namespace: ${spring.profiles.active:dev}
        group: DEFAULT_GROUP
      config:
        import-check:
          enabled: true
        namespace: ${spring.profiles.active:dev}
        group: AUTH_GATEWAY
        file-extension: yaml
    gateway:
      server:
        webflux:
          loadbalancer:
            use404: true
          discovery:
            locator:
              # 开启服务发现自动路由
              enabled: true
              # 服务名转为小写
              lower-case-service-id: true
# 默认关闭 knife4j
knife4j:
  basic:
    enable: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
auth:
  gateway:
    security:
      # 回滚开关：关闭后所有路径回到轻校验模式
      strict-enabled: false
      # 灰度时先配置 1-2 条高风险路径，再逐步扩大范围
      strict-patterns: [ ]