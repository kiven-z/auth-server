server:
  port: 8080

spring:
  cloud:
    nacos:
      # Docker Compose 会用 SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848 覆盖
      server-addr: nacos:8848

logging:
  level:
    root: warn
    com.auth: info
    org.springframework: warn
    reactor.netty: warn

# ----- 网关 JWT 校验策略（JwtValidateGlobalFilter）-----
auth:
  gateway:
    security:
      strict-enabled: false
      strict-patterns: []
      # strict-patterns:
      #   - /api/system/admin/**
      #   - /api/auth/session/**
