# 将业务镜像构建并推送到阿里云容器镜像服务 ACR（个人版 / 企业版均可）
# 使用前在仓库 Settings → Secrets 配置：
#   ACR_REGISTRY   例：registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  例：bunny-auth
#   ACR_USERNAME   镜像仓库登录名
#   ACR_PASSWORD   镜像仓库登录密码 / 临时令牌
#
# 推送结果示例：
#   registry.cn-hangzhou.aliyuncs.com/bunny-auth/service-auth:prod-<sha>
#   registry.cn-hangzhou.aliyuncs.com/bunny-auth/service-auth:prod-latest

name: Build and push to ACR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_TAG_PREFIX: prod

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-auth
            dockerfile: docker/service-auth/Dockerfile
          - name: service-system
            dockerfile: docker/service-system/Dockerfile
          - name: auth-gateway
            dockerfile: docker/auth-gateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "tag_sha=${IMAGE_TAG_PREFIX}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE_TAG_PREFIX}-latest" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_latest }}
          # 基础镜像若在国内拉不动，请在 ACR 建镜像缓存或改用国内镜像源
          pull: false
