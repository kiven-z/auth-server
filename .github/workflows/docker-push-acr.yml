# 将业务镜像构建并推送到阿里云容器镜像服务 ACR（个人版 / 企业版均可）
# 使用前在仓库 Settings → Secrets 配置：
#   ACR_REGISTRY   例：registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  例：bunny-auth
#   ACR_USERNAME   镜像仓库登录名
#   ACR_PASSWORD   镜像仓库登录密码 / 临时令牌
#
# 流程：Maven 只编一次 → 三个轻量 runtime 镜像并行推送（避免矩阵内重复编译）
#
# 推送结果示例：
#   registry.cn-hangzhou.aliyuncs.com/bunny-auth/service-auth:prod-<sha>
#   registry.cn-hangzhou.aliyuncs.com/bunny-auth/service-auth:prod-latest

name: Build and push to ACR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_TAG_PREFIX: prod
  JAVA_VERSION: "17"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Package all services (once)
        run: |
           mvn -B \
            -pl services/service-auth,services/service-system/service-system-bootstrap,auth-gateway \
            -am package -Pdocker -DskipTests

      - name: Stage jars
        run: |
          mkdir -p build/jars
          cp services/service-auth/target/service-auth-*.jar build/jars/service-auth.jar
          cp services/service-system/service-system-bootstrap/target/service-system.jar build/jars/service-system.jar
          cp auth-gateway/target/auth-gateway-*.jar build/jars/auth-gateway.jar
          ls -lh build/jars

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: build/jars
          retention-days: 1

  build-push:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-auth
            jar: service-auth.jar
            port: "20001"
          - name: service-system
            jar: service-system.jar
            port: "20002"
          - name: auth-gateway
            jar: auth-gateway.jar
            port: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: build/jars

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "tag_sha=${IMAGE_TAG_PREFIX}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE_TAG_PREFIX}-latest" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          push: true
          pull: false
          build-args: |
            APP_JAR=build/jars/${{ matrix.jar }}
            SERVER_PORT=${{ matrix.port }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_latest }}
