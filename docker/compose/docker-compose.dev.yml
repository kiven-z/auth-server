name: auth-app-dev

services:
  service-auth:
    build:
      context: ../..
      dockerfile: docker/service-auth/Dockerfile
    image: auth/service-auth:local
    container_name: service-auth
    env_file:
      - ../env/dev/service-system.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "20001:20001"
    restart: unless-stopped
    networks:
      - auth-network

  service-system:
    build:
      context: ../..
      dockerfile: docker/service-system/Dockerfile
    image: auth/service-system:local
    container_name: service-system
    env_file:
      - ../env/dev/service-system.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "20002:20002"
    restart: unless-stopped
    networks:
      - auth-network

  auth-gateway:
    build:
      context: ../..
      dockerfile: docker/auth-gateway/Dockerfile
    image: auth/auth-gateway:local
    container_name: auth-gateway
    env_file:
      - ../env/dev/service-system.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - auth-network

networks:
  auth-network:
    external: true
