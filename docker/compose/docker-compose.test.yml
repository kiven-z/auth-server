name: auth-app-test

services:
  service-auth:
    build:
      context: ../..
      dockerfile: docker/service-auth/Dockerfile
    image: auth/service-auth:local-test
    container_name: service-auth-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 20001
    ports:
      - "21001:20001"
    networks:
      - auth-network

  service-system:
    build:
      context: ../..
      dockerfile: docker/service-system/Dockerfile
    image: auth/service-system:local-test
    container_name: service-system-test
    env_file:
      - ../env/test/service-system.env
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 20002
    ports:
      - "21002:20002"
    networks:
      - auth-network

  auth-gateway:
    build:
      context: ../..
      dockerfile: docker/auth-gateway/Dockerfile
    image: auth/auth-gateway:local-test
    container_name: auth-gateway-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 8080
    ports:
      - "9080:8080"
    networks:
      - auth-network

networks:
  auth-network:
    external: true
