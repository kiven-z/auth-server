spring:
  cloud:
    nacos:
      server-addr: 192.168.3.4:8848

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.3.4:3306/auth_admin_base?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: dev_user
    password: Dev1234!
    hikari:
      maximum-pool-size: 200
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 192.168.3.4
      port: 6379
      database: 0
      password: "Dev1234!"
      lettuce:
        pool:
          enabled: true
          max-active: 200
          max-wait: 5000ms
          max-idle: 50
          min-idle: 10

knife4j:
  basic:
    enable: false
springdoc:
  show-actuator: false
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    deep-linking: true
    persist-authorization: true
    display-operation-id: false
    default-model-rendering: example

logging:
  level:
    root: info
    com.auth: debug
