spring:
  mail:
    default-encoding: UTF-8
    ssl:
      enabled: true
    host: smtp.qq.com
    port: 465
    username: ${AUTH_EMAIL_CONFIG_USERNAME:}
    password: ${AUTH_EMAIL_CONFIG_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectionTimeout: 5000
          timeout: 5000
          writeTimeout: 5000
