spring:
  # 设置邮箱配置
  mail:
    default-encoding: UTF-8
    ssl:
      enabled: true
    host: smtp.qq.com
    port: 465
    username: ${AUTH_EMAIL_CONFIG_USERNAME}
    password: ${AUTH_EMAIL_CONFIG_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectionTimeout: 5000
          timeout: 5000
          writeTimeout: 5000

# 短信配置：通过 auth.message.sms 前缀读取，SmsProperties 绑定
auth:
  message:
    sms:
      access-key-id: ${AUTH_SMS_ACCESS_KEY_ID}
      access-key-secret: ${AUTH_SMS_ACCESS_KEY_SECRET}