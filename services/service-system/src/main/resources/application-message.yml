spring:
  mail:
    default-encoding: UTF-8
    ssl:
      enabled: true
    host: smtp.qq.com
    port: 465
    username: ${AUTH_EMAIL_CONFIG_USERNAME}
    password: ${AUTH_EMAIL_CONFIG_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectionTimeout: 5000
          timeout: 5000
          writeTimeout: 5000

# sms4j 原生厂商配置（签名、AK 以阿里云控制台为准）
sms:
  config-type: yaml
  blends:
    aliyun-main:
      supplier: alibaba
      access-key-id: ${AUTH_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${AUTH_SMS_ACCESS_KEY_SECRET:}
      signature: ${AUTH_SMS_SIGN_NAME:}

# 业务侧：开关、默认 blend、签名提示（须与 sms.blends.aliyun-main.signature 一致）
auth:
  message:
    sms:
      enabled: true
      default-config-id: aliyun-main
      default-sign-name: ${AUTH_SMS_SIGN_NAME:}
