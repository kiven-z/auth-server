spring:
  # 设置邮箱配置
  mail:
    default-encoding: UTF-8
    ssl:
      enabled: true
    host: smtp.qq.com
    port: 465
    username: ${AUTH_EMAIL_CONFIG_USERNAME}
    password: ${AUTH_EMAIL_CONFIG_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectionTimeout: 5000
          timeout: 5000
          writeTimeout: 5000

# 短信：切换厂商只改 provider 与对应子节点（aliyun / tencent）
auth:
  message:
    sms:
      enabled: false
      provider: aliyun
      aliyun:
        access-key-id: ${AUTH_SMS_ACCESS_KEY_ID:}
        access-key-secret: ${AUTH_SMS_ACCESS_KEY_SECRET:}
        region: cn-hangzhou
        endpoint: dypnsapi.aliyuncs.com
      tencent:
        secret-id: ${AUTH_SMS_TENCENT_SECRET_ID:}
        secret-key: ${AUTH_SMS_TENCENT_SECRET_KEY:}
        region: ap-guangzhou
