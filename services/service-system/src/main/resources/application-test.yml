          min-idle: 0

# 可以配置很多但只能使用一个！！！其他平台参考官方文档
dromara:
  # 文件存储配置
  x-file-storage:
    # 默认使用的存储平台
    default-platform: local-plus-1
    # default-platform: minio-1
    # 缩略图后缀，例如【.min.jpg】【.png】
    thumbnail-suffix: ".min.jpg"
    local-plus:
      # 存储平台标识
      - platform: local-plus-1
        # 启用存储
        enable-storage: true
        # 启用访问（线上请使用 Nginx 配置，效率更高）
        domain: /api/local-file
        base-path: ""
        enable-access: true
        path-patterns: /api/local-file/**
        # storage-path: ~/bunny-admin/temp
        storage-path: D:/Temp/
    minio:
      - platform: minio-1 # 存储平台标识
        enable-storage: true  # 启用存储
        end-point: "http://129.211.31.58:9000"
        domain: "http://129.211.31.58:9000/auth-admin"
        bucket-name: auth-admin
        access-key: bunny
        secret-key: "02120212"
        base-path: ""

logging:
  level:
    root: info
    com.auth: debug
    org.springframework.security: debug
    com.github.gavlyukovskiy: debug

# 关闭 knife4j
knife4j:
  basic:
    enable: false
springdoc:
  api-docs:
    # 是否启用OpenAPI JSON端点
    enabled: false
  swagger-ui:
    # 是否启用Swagger UI可视化界面
    enabled: false
    try-it-out-enabled: false
    display-request-duration: false