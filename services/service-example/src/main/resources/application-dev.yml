# service-example：集成验证专用；JWT/密钥等以 Nacos common-config 为准
server:
  port: 20009
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  cloud:
    nacos:
      server-addr: 192.168.3.4:8848

  data:
    redis:
      host: 192.168.3.4
      port: 6379
      database: 0
      password: "Dev1234!"
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-wait: 2000ms
          max-idle: 16
          min-idle: 4

logging:
  level:
    root: info
    com.auth: debug
