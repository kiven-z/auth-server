server:
  port: 22009
  tomcat:
    threads:
      max: 120
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  threads:
    virtual:
      enabled: true

  cloud:
    nacos:
      server-addr: 192.168.3.4:8848

  data:
    redis:
      host: 192.168.3.4
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:changeme}
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-wait: 2000ms
          max-idle: 16
          min-idle: 4

logging:
  level:
    root: warn
    com.auth: info
    org.springframework: warn
