server:
  port: 20001
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  session:
    jdbc:
      initialize-schema: embedded
      schema: classpath:org/springframework/session/jdbc/schema-mysql.sql

  cloud:
    nacos:
      server-addr: nacos:8848
      discovery:
        namespace: ${NACOS_NAMESPACE:docker}
      config:
        namespace: ${NACOS_NAMESPACE:docker}

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:auth_admin_base}?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useLocalSessionState=true
    username: ${MYSQL_USER:dev_user}
    password: ${MYSQL_PASSWORD:Dev1234!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: redis
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:Dev1234!}
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-wait: 2000ms
          max-idle: 16
          min-idle: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.auth: info
