server:
  port: 22001
  tomcat:
    threads:
      max: 120
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  threads:
    virtual:
      enabled: true

  cloud:
    nacos:
      server-addr: 192.168.3.4:8848

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://192.168.3.4:3306/auth_admin_prod?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useLocalSessionState=true
    username: prod_user
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000

  data:
    redis:
      host: 192.168.3.4
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:changeme}
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-wait: 2000ms
          max-idle: 16
          min-idle: 4

logging:
  level:
    root: warn
    com.auth: info
    org.springframework: warn
    org.mybatis: warn
    com.zaxxer.hikari: warn
