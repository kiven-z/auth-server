server:
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  session:
    jdbc:
      initialize-schema: embedded
      schema: classpath:org/springframework/session/jdbc/schema-mysql.sql

  # ----- MySQL：同 Docker 网络用服务名 mysql-master -----
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql-master:3306/auth_admin?serverTimezone=UTC&useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useLocalSessionState=true
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:Dev1234!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-init-sql: SET time_zone = '+00:00'

  cloud:
    nacos:
      # Docker Compose 会用 SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848 覆盖
      server-addr: nacos:8848

logging:
  level:
    root: warn
    com.auth: info
    org.springframework: warn

# ----- 授权失效幂等事件清理（auth.invalidation.*）-----
auth:
  invalidation:
    processing-claim-timeout-minutes: 30
    processing-claim-cleanup-enabled: true
    processing-claim-cleanup-interval-ms: 300000
    success-retention-days: 90
    success-cleanup-enabled: true
    success-cleanup-cron: "0 0 4 * * ?"
