spring:
  session:
    jdbc:
      initialize-schema: embedded
      schema: classpath:org/springframework/session/jdbc/schema-mysql.sql

  cloud:
    nacos:
      server-addr: 192.168.3.19:8848

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://192.168.3.19:3306/auth_admin_base?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: dev_user
    password: Dev1234!
    hikari:
      maximum-pool-size: 200
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 192.168.3.19
      port: 6379
      database: 0
      password: "Dev1234!"
      lettuce:
        pool:
          enabled: true
          # 最大连接数
          max-active: 200
          # 最大阻塞等待时间(负数表示没限制)
          max-wait: 5000ms
          # 最大空闲
          max-idle: 50
          # 最小空闲
          min-idle: 10

logging:
  level:
    root: warn
    com.auth: debug

